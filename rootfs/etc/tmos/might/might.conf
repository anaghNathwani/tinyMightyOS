# might.conf — TinyMightyOS package manager configuration

[general]
# Parallel downloads (0 = auto = nproc)
parallel_downloads=4

# Verify package signatures
verify_signatures=yes

# Keep downloaded packages in cache
keep_cache=yes

# Cache directory
cache_dir=/var/cache/might

# Database directory
db_dir=/var/lib/might

# Log file
log_file=/var/log/might.log

[install]
# Automatically install recommended packages
install_recommends=no

# Automatically remove orphaned dependencies on remove
autoremove=yes

[network]
# Download timeout (seconds)
timeout=60

# Retry failed downloads
retries=3

# Use mirrors
use_mirrors=yes
